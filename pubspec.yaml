name: ddai_holdem
description: "친구들과 온라인으로 즐기는 텍사스 홀덤."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flame: ^1.38.2
  flutter:
    sdk: flutter
  meta: ^1.16.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # 한글 글꼴을 앱에 함께 넣는다. 웹에서 구글 CDN 이 막히거나 느릴 때
  # 글자가 통째로 비어 보이는 것을 막는다. 상용 2,350 음절만 남긴 Noto Sans KR
  # (OFL, assets/fonts/OFL.txt) 이라 굵기당 450KB 안쪽이다.
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
